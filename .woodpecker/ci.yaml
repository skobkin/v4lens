when:
  - event: [push, pull_request, tag]

# Full history: GoReleaser derives the changelog from tag-to-tag commits.
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0

steps:
  fmt:
    image: golang:1.27-alpine
    commands:
      - |
        fmt_out=$(/usr/local/go/bin/gofmt -l ./cmd ./internal 2>/dev/null)
        if [ -n "$fmt_out" ]; then
          echo "The following files need gofmt:"
          echo "$fmt_out"
          exit 1
        fi

  lint:
    image: golang:1.27-alpine
    environment:
      CACHE_ROOT: "$PWD/.ci-cache"
      GOMODCACHE: "$PWD/.ci-cache/gomod"
      GOCACHE: "$PWD/.ci-cache/gobuild"
      GOPATH: "$PWD/.ci-cache/gopath"
      GOLANGCI_LINT_CACHE: "$PWD/.ci-cache/golangci"
    commands:
      - apk add --no-cache git build-base pkgconf linux-headers mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - /root/go/bin/golangci-lint run ./...

  vet:
    image: golang:1.27-alpine
    environment:
      CACHE_ROOT: "$PWD/.ci-cache"
      GOMODCACHE: "$PWD/.ci-cache/gomod"
      GOCACHE: "$PWD/.ci-cache/gobuild"
      GOPATH: "$PWD/.ci-cache/gopath"
    commands:
      - apk add --no-cache git build-base pkgconf linux-headers mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - go vet ./...

  test:
    image: golang:1.27-alpine
    environment:
      CACHE_ROOT: "$PWD/.ci-cache"
      GOMODCACHE: "$PWD/.ci-cache/gomod"
      GOCACHE: "$PWD/.ci-cache/gobuild"
      GOPATH: "$PWD/.ci-cache/gopath"
    commands:
      - apk add --no-cache git build-base pkgconf linux-headers mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      # Integration tests stay behind the `integration` build tag; baseline CI needs no camera.
      - go test ./...

  build:
    image: golang:1.27-alpine
    # Tag events build through GoReleaser below; this is the smoke build.
    when:
      - event: push
      - event: pull_request
    environment:
      CACHE_ROOT: "$PWD/.ci-cache"
      GOMODCACHE: "$PWD/.ci-cache/gomod"
      GOCACHE: "$PWD/.ci-cache/gobuild"
      GOPATH: "$PWD/.ci-cache/gopath"
    commands:
      - apk add --no-cache git build-base pkgconf linux-headers mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - mkdir -p dist
      - go build -trimpath -o dist/v4lens ./cmd/v4lens

  release:
    image: goreleaser/goreleaser-cross:v1.27
    pull: true
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_TOKEN
    commands:
      - test -n "$CI_FORGE_URL" || (echo "CI_FORGE_URL is empty. Cannot derive Forge URLs for GoReleaser." && exit 1)
      - test -n "$FORGE_API_URL" || export FORGE_API_URL="$CI_FORGE_URL/api/v1"
      - test -n "$FORGE_DOWNLOAD_URL" || export FORGE_DOWNLOAD_URL="$CI_FORGE_URL"
      - apt-get update
      # Wayland + xkbcommon headers: go-gl/glfw includes wl_platform.h
      # unconditionally, which needs them.
      - apt-get install --no-install-recommends -y pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev
      - rm -rf "$PWD/.ci-cache"
      - goreleaser release --clean
    when:
      - event: tag
